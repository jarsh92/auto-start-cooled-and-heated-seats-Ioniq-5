name: Auto Seat startup fix candidate validation

on:
  pull_request:
  push:
    branches: [main, fix/startup-temperature-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Shell syntax and clean package regression
        run: |
          for script in package/scripts/*.sh package/svc/*.sh usb/*.sh; do sh -n "$script"; done
          bash -n tools/make_package.sh tools/build_apk.sh
          python3 tests/check_clean_install.py
          python3 tests/check_commands.py
          python3 tests/check_startup_priority.py
          python3 tests/check_startup_temperature.py
      - name: Install original APK signature verifier
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'build-tools;30.0.3'
      - name: Build candidate from immutable APK and service-only change
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          python3 tools/package_release.py --verify-signature --startup-candidate
          python3 tests/check_package.py --startup-candidate
          (cd dist/startup-candidate && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: autoseat.heat-2.0-startup-fix-CANDIDATE
          path: dist/startup-candidate/
          if-no-files-found: error
          retention-days: 90

  publish:
    # Owner-authorized PUBLIC TEST only. Never replace the stable assets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/startup-temperature-validation'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: autoseat.heat-2.0-startup-fix-CANDIDATE
          path: dist/startup-candidate
      - name: Publish public test and warn about earlier startup bug
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=v2.0-startup-temperature-rc1
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              dist/startup-candidate/Auto-Seat-2.0-autoseat.heat-startup-fix-CANDIDATE-USB.zip \
              dist/startup-candidate/autoseat.heat-2.0.zip \
              dist/startup-candidate/Auto-Seat-2.0-autoseat.heat-startup-fix-CANDIDATE-source.zip \
              dist/startup-candidate/SHA256SUMS.txt \
              dist/startup-candidate/build-validation.json \
              --target "$GITHUB_SHA" \
              --title "Auto Seat 2.0 — Startup Temperature Fix (Public Test)" \
              --notes-file docs/PUBLIC-TEST-RELEASE.md --prerelease --latest=false
          fi
          export PUBLIC_TEST_URL="$(gh release view "$TAG" --json url --jq .url)"
          for old in v2.0-autoseat.heat-r1 v2.0; do
            gh release view "$old" --json body --jq .body > /tmp/auto-seat-previous-notes.md
            python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('/tmp/auto-seat-previous-notes.md')
          original=p.read_text()
          marker='Known startup-temperature bug'
          if marker not in original:
              warning=('> [!WARNING]\n'
                       '> **Known startup-temperature bug:** this older build may accept an unready -40-degree reading and activate heating incorrectly.\n'
                       '> A corrected **public test installer** is available: '+os.environ['PUBLIC_TEST_URL']+'\n'
                       '> The fix has passed automated checks and initial owner installation feedback; repeated vehicle-start validation is still pending.\n\n')
              p.write_text(warning+original)
          PY
            gh release edit "$old" --notes-file /tmp/auto-seat-previous-notes.md
          done
          gh release view "$TAG" --json url,isPrerelease,assets
